steps:
  - name: ${_IMAGE}
    dir: /app/local-processor
    entrypoint: /opt/venv/bin/python
    args:
      - -c
      - |
        import numpy as np
        from football_detection import PersonTracker

        tracker = PersonTracker(sample_fps=10, method="tracktrack")
        frame = np.zeros((720, 1280, 3), dtype=np.uint8)
        detections = [{
            "x1": 0.35,
            "y1": 0.25,
            "x2": 0.45,
            "y2": 0.80,
            "confidence": 0.95,
        }]
        for frame_index in range(3):
            tracker.update(detections, frame, frame_index / 10)
        assert tracker.active_method == "tracktrack"
  - name: ${_IMAGE}
    dir: /app
    entrypoint: node
    args:
      - --input-type=module
      - -e
      - |
        import assert from "node:assert/strict";
        import { mkdir, readFile, rm, writeFile } from "node:fs/promises";
        import { join } from "node:path";
        import { createCheckpointArchive, restoreCheckpointArchive } from "./deploy/cloud-run/checkpoint-store.mjs";
        const root = "/tmp/checkpoint-smoke";
        const id = "11111111-2222-4333-8444-555555555555";
        await rm(root, { recursive: true, force: true });
        await mkdir(join(root, "jobs"), { recursive: true });
        await mkdir(join(root, "outputs", id, "tracking"), { recursive: true });
        await writeFile(join(root, "jobs", id + ".json"), JSON.stringify({ id, stage: "tracking", progress: 33, sourceKey: join(root, "uploads", id, "source.mp4") }));
        await writeFile(join(root, "outputs", id, "tracking", "tracking.json"), "durable-tracking");
        const archive = "/tmp/checkpoint-smoke.tar";
        await createCheckpointArchive({ dataRoot: root, jobId: id, archivePath: archive, stage: "tracking", progress: 33 });
        await rm(join(root, "jobs"), { recursive: true, force: true });
        await rm(join(root, "outputs"), { recursive: true, force: true });
        const restored = await restoreCheckpointArchive({ dataRoot: root, jobId: id, archivePath: archive });
        assert.equal(restored.progress, 33);
        assert.equal(await readFile(join(root, "outputs", id, "tracking", "tracking.json"), "utf8"), "durable-tracking");
options:
  logging: CLOUD_LOGGING_ONLY
